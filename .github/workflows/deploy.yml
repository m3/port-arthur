name: Deploy Port Arthur Website to Hetzner VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20
          cache: 'npm'

      # Step 3: Install dependencies and compile
      - name: Install & Build
        run: |
          npm install
          npm run build

      # Step 4: Deploy built static files to Hetzner VPS
      - name: Deploy to Hetzner VPS via SSH/rsync
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          # SSH Private Key for your Hetzner VPS (Stored in GitHub Secrets)
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          # Remote VPS IP Address
          REMOTE_HOST: ${{ secrets.HETZNER_VPS_IP }}
          # Remote SSH User (e.g. root or deploy)
          REMOTE_USER: ${{ secrets.HETZNER_VPS_USER }}
          # Source directory to upload (the compiled static files)
          SOURCE: "dist/"
          # Target path on the Hetzner VPS served by Nginx / Caddy
          TARGET: ${{ secrets.HETZNER_DEPLOY_PATH }} # e.g., /var/www/portarthur
          # Flags for rsync transfer
          ARGS: "-rlgoDzvO --delete"
