name: Deploy Port Arthur Website to Hetzner VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install & Build
        run: |
          npm install
          npm run build

      - name: Deploy to Hetzner VPS via SSH/rsync
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HETZNER_VPS_IP }}
          REMOTE_USER: ${{ secrets.HETZNER_VPS_USER }}
          # Port mapping: allows fallback to standard 22, or reads a custom port secret
          REMOTE_PORT: ${{ secrets.HETZNER_SSH_PORT || '22' }}
          SOURCE: "dist/"
          TARGET: ${{ secrets.HETZNER_DEPLOY_PATH }}
          ARGS: "-rlgoDzvO --delete"
